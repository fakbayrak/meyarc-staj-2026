spring:
  application:
    name: library-service

  datasource:
    url: jdbc:postgresql://localhost:5434/library
    username: library
    password: library

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml

server:
  port: 8090
