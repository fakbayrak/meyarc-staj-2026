services:
  postgres:
    image: postgres:16
    container_name: library-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: library
      POSTGRES_USER: library
      POSTGRES_PASSWORD: library
    ports:
      - "5434:5432"
    volumes:
      - library-postgres-data:/var/lib/postgresql/data

volumes:
  library-postgres-data:
